name: Build AndroidKitchen.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

env:
  EROFS_TOOLS_URL: https://github.com/sekaiacg/erofs-tools/releases/download/v1.9.4-261112/erofs-tools-v1.9.4-gf36cadb5-261112-Linux_x86_64.zip

jobs:
  # Filesystem / firmware tests on Linux, where test images can be made with mkfs tools.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create ext4 test images
        run: |
          set -e
          mkdir -p testdata/sys/etc/permissions testdata/sys/app/Foo testdata/ven/path/to/dir
          echo "ro.build.id=CI" > testdata/sys/build.prop
          echo "test file in ext4" > testdata/sys/test_file
          echo "<permissions/>" > testdata/sys/etc/permissions/foo.xml
          head -c 700000 /dev/urandom > testdata/sys/app/Foo/Foo.bin
          echo "resolved!" > testdata/ven/path/to/dir/file.ext
          ln -s to/dir/file.ext testdata/ven/path/link.ext
          ln -s ../../missing testdata/ven/path/dangling
          truncate -s 8M testdata/ext4.bin testdata/ext4_symlink_test.bin
          mkfs.ext4 -q -F -b 4096 -d testdata/sys testdata/ext4.bin
          mkfs.ext4 -q -F -b 4096 -d testdata/ven testdata/ext4_symlink_test.bin

      - name: Test - firmware pipeline (tar.md5/lz4/sparse/super, payload.bin, new.dat.br)
        run: python tests/smoke_test.py testdata

      - name: Get mkfs.erofs (erofs-utils 1.9.4)
        run: |
          curl -fsSL -o erofs.zip "$EROFS_TOOLS_URL"
          mkdir erofs-tools && unzip -q erofs.zip -d erofs-tools
          chmod +x erofs-tools/*
          ./erofs-tools/mkfs.erofs -V

      - name: Test - EROFS reader (all mkfs.erofs option sets)
        run: python tests/erofs_test.py ./erofs-tools/mkfs.erofs "$RUNNER_TEMP/erofs"

  # Windows: flash-script test (needs cmd.exe), exe build, release.
  build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags, for the release notes' changelog link

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Version check (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP=$(python -c "import kitchen; print(kitchen.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          echo "app version: $APP, tag: $TAG"
          if [ "$APP" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match kitchen/__init__.py __version__ ($APP)"
            exit 1
          fi

      - name: Test - flash script (runs flash_all.bat against a fake fastboot)
        run: python tests/flash_test.py

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name AndroidKitchen
          --hidden-import lz4.frame --hidden-import lz4.block
          --hidden-import brotli --hidden-import zstandard
          AndroidKitchen.py

      - name: Smoke-run the exe
        shell: pwsh
        run: |
          $p = Start-Process dist\AndroidKitchen.exe -PassThru
          Start-Sleep 8
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "exe exited with code $($p.ExitCode)" }
          Get-Process AndroidKitchen -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Item dist\AndroidKitchen.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: AndroidKitchen-${{ github.sha }}
          path: dist/AndroidKitchen.exe
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes = this version's section of CHANGELOG.md ("## 1.2.3 (date)")
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' CHANGELOG.md \
            | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VER (...)' section"
            exit 1
          fi
          PREV=$(git tag --sort=-v:refname | grep -v "^$GITHUB_REF_NAME$" | head -n 1)
          {
            echo
            echo '**Download:** `AndroidKitchen.exe` below. It is a single file and needs no installation.'
            [ -n "$PREV" ] && echo && echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$GITHUB_REF_NAME"
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/AndroidKitchen.exe \
            --title "Android Kitchen $VER" \
            --notes-file notes.md
